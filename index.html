<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser chrome / address-bar tint matches the CORE BASE charcoal -->
    <meta name="theme-color" content="#121212" />
    <meta name="description" content="GUC Project Portfolio Platform – showcase and discover student projects" />
    <title>GUC Portfolio Platform</title>
    <!-- Inter for UI copy + Fraunces for editorial-feeling headlines.
         Fraunces ships an italic axis used by the marketing headline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface-900 text-slate-100 antialiased">
    <!--
      #root is the single mount point for the entire React application.
      React DOM renders the <App /> component tree here via main.jsx.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
